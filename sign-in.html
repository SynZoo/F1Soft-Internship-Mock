<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/index.css">
    <script defer src="JS/sign-in.js"></script>
    <title>F1Soft</title>
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="login-box">
                <h3>Sign In</h3>
                <p>Enter your email and password to sign in!</p>
                <button id="sign-in" class="btn btn-secondary"><img src="Icon/google.png" alt="Google Logo"
                        width="20px"> Sign in with Google</button>
                <div class="seperator">or</div>
                <div id="form" class="form">
                    <label for="email">Email<span class="symbol">*</span></label><br>
                    <input class="input-field" type="email" name="email" id="email" placeholder="mail@simmple.com"><br>
                    <label for="password">Password<span class="symbol">*</span></label><br>
                    <input class="input-field" type="password" name="password" id="password" placeholder="Min. 8 characters"><br>

                    <div class="options">
                        <label for="checkbox"> <input type="checkbox" name="" id="" checked>Keep me logged in</label>
                        <a class="link" href="#">Forget Password?</a>
                    </div>

                    <button id="login-btn" class="btn btn-primary"  value="login">Sign In</button>
                </div>
                <div class="register">Not registered yet? <a class="link" href="#">Create an Account</a></div>
            </div>
        </div>
        <div class="row">
            <img class="background-img" src="Image/background.png" alt="mosiac background">
            <div class="brand-box">
                <img class="logo" src="Image/f1soft.png" alt="F1soft Logo" width="50%">
                <h3>F1soft Group</h3>
                <a href="https://f1soft.com/">
                    <div class="info-box">
                        <p>Learn more about F1soft on</p>
                        <h2>F1Soft.com</h3>
                    </div>
                </a>
            </div>
        </div>
    </div>
    <div class="footer">
        <div class="credit">© 2025 Bikrant Shrestha. All Rights Reserved. Made with love by SynZoo!</div>
        <div class="service">
            <li>Marketplace</li>
            <li>License</li>
            <li>Terms of Use</li>
            <li>Blog</li>
        </div>
    </div>
    <div class="circle"><img src="Icon/moon.png" alt="moon"></div>
</body>

</html>
